[project]
name = "tyre-finder"
version = "1.1.1"
description = "Desktop app that searches 10 Bulgarian online tyre shops by size and season and compares prices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.2",
    "platformdirs>=4.14.8",
]

[project.scripts]
tyre-finder = "tyre_finder.app:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tyre_finder"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PL", "BLE"]
ignore = ["PLR0913", "PLR2004", "ANN401", "RUF001", "RUF002", "RUF003", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004"]
"src/tyre_finder/ui/icons.py" = ["E501"]  # SVG path data

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
